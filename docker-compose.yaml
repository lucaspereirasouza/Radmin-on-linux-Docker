services:
  windows:
    build: .
    image: windows_radmin_vpn:0.1
    container_name: windows
    environment:
      VERSION: "7"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "10G"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3390:3389/tcp
      - 3390:3389/udp
    stop_grace_period: 2m
    restart: on-failure
    volumes:
      - ./storage:/storage
      - ./shared:/shared
    networks:
      _external:
        ipv4_address: 172.25.0.3
      _internal:
        ipv4_address: 26.0.0.2
networks:
  _external:
    name: radminvpn_external
    external: false
    driver: bridge
    driver_opts:
      gateway_mode_ipv4: nat
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
  _internal:
    name: windows_internal_network
    external: false
    driver: macvlan
    driver_opts:
      macvlan_mode: bridge
    ipam:
      config:
        - subnet: 26.0.0.0/16
          gateway: 26.0.0.1
